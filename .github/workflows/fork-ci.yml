name: Fork CI

# Fork-only (W01). Quality gates for fork code: patch registry, typecheck, lint (fork paths), test tiers, build.
# `pull_request` (never pull_request_target), read-only token, NO secrets. Third-party actions pinned by SHA.
# Upstream's own workflows (release, docker, ...) are untouched; PR titles on this fork must contain [skip-release].

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  patches:
    name: check-patches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash scripts/fork/check-patches.sh

  typecheck:
    name: tsc (no new errors vs baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:fork

  lint-fork:
    name: lint (fork-owned files only; upstream baseline is red, see ADR-000)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: biome lint fork paths (errors fail, warnings are reported)
        run: >-
          pnpm exec biome lint
          src/fork app/api/fork
          "app/(customer)/dashboard/(admin)/integrations"
          vitest.config.ts drizzle.fork.config.ts

  test:
    name: test:fork unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine # runner's pg_dump is 16: the pre-migration dump test needs client >= server
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FORK_TEST_DATABASE_URL: postgres://ci:ci-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: python3-cryptography (decrypt-archive tests, W02b; same bare-host prerequisite as the DR path)
        run: |
          python3 -c "import cryptography.hazmat.primitives.ciphers.aead" 2>/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-cryptography; }
          python3 -c "import cryptography; print('cryptography', cryptography.__version__)"
      - name: restic (W14 manifest store tests; same binary the dashboard image ships)
        run: |
          command -v restic >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends restic; }
          restic version
      - name: jq + python3-yaml (W20a compose-policy parity tests run the CLI's jq program and kit-tool on the shared corpus)
        run: |
          python3 -c "import yaml" 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-yaml; }
          command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends jq; }
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"; jq --version
      - run: pnpm test:fork:unit
      - run: pnpm test:fork:integration

  recover-cli:
    name: portabase-recover CLI (ShellCheck + shell tests, W14b)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: bare-host prerequisites (the same packages the "My server died" guide installs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck restic rclone jq python3-cryptography python3-yaml
          openssl version; restic version; rclone version | head -1; docker compose version
          docker pull -q busybox:latest
      - name: ShellCheck
        run: shellcheck -x -S style scripts/fork/recover/portabase-recover scripts/fork/recover/tests/run.sh
      - name: shell tests (mutation, injection, truncation, read-scope, deny-list, round-trip fixtures; full restore against the runner's docker)
        run: bash scripts/fork/recover/tests/run.sh

  e2e:
    name: build + test:fork e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FORK_TEST_DATABASE_URL: postgres://ci:ci-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:fork:e2e

  audit:
    name: pnpm audit --prod (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
