# Disposable Portabase dashboard + Postgres + MinIO for the fork lab (W02). Lab only: all ports 127.0.0.1.
# The dashboard image is the upstream release the fork is based on (fork base 1.36.0): W02 writes no dashboard code.
name: forklab-portabase
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: portabase
      POSTGRES_USER: portabase
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?run lab.sh up}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portabase -d portabase"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [forklab_net]

  minio:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${LAB_MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${LAB_MINIO_ROOT_PASSWORD:?}
      # image defaults point the *_FILE variants at secret files; the plain variables above win only when these are unset
      MINIO_ROOT_USER_FILE: ""
      MINIO_ROOT_PASSWORD_FILE: ""
      MINIO_ACCESS_KEY_FILE: ""
      MINIO_SECRET_KEY_FILE: ""
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      forklab_net:
        aliases: [forklab-minio]

  dashboard:
    image: ghcr.io/portabase/portabase:1.36.0@sha256:85a4d8f5bbd2ad5744bda55ea4227743da77e91cca0e9ef8d157fd8b34cca810
    depends_on:
      db: {condition: service_healthy}
    environment:
      TZ: UTC
      DATABASE_URL: postgresql://portabase:${LAB_DB_PASSWORD:?}@db:5432/portabase
      # One URL for browser (Chrome resolves *.localhost to loopback, published port 18887) and lab containers (alias on `edge`)
      PROJECT_URL: http://forklab-dashboard.localhost:18887
      PROJECT_SECRET: ${LAB_PROJECT_SECRET:?}
      TRUSTED_DOMAINS: http://forklab-dashboard.localhost:18887,http://127.0.0.1:18887
      AUTH_DEFAULT_USER: ${LAB_ADMIN_EMAIL:-admin@lab.invalid}
      AUTH_DEFAULT_USER_NAME: lab-admin
      AUTH_DEFAULT_PASSWORD: ${LAB_ADMIN_PASSWORD:?}
      API_ENABLED: "true"
      TELEMETRY: "false"
      MCP_ENABLED: "false"
      LOG_LEVEL: info
    ports: ["127.0.0.1:18887:80"]
    volumes: [dashboard-data:/data]
    networks: [forklab_net]

  edge:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on: [dashboard]
    volumes: [./edge.nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    networks:
      forklab_net:
        aliases: [forklab-dashboard.localhost]

volumes:
  pgdata:
  miniodata:
  dashboard-data:

networks:
  forklab_net:
    name: forklab_net
    external: true
