# In-network alias so the SAME URL (http://forklab-dashboard.localhost:18887) works from the browser (Chrome maps *.localhost
# to loopback via the published port) and from lab containers (docker DNS alias -> this proxy). Lab only; no TLS.
server {
    listen 18887;
    location / {
        proxy_pass http://dashboard:80;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 0;
    }
}
