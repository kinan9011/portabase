# /etc/nftables.d/pbm-runner.nft — mirror runner egress policy (ADR-008 DD-5). DENY BY DEFAULT for mirrors and for the agent network.
# NEVER `flush ruleset` here: that would wipe Docker's own rules. The idempotent table idiom below only ever touches `inet pbm_runner`.
# The defs file (/etc/pbm/runner-defs.nft) holds the per-host variables; runner-dns.nft is the DNS-egress match (vm: keeps systemd-resolved working; lab: no such user).
include "/etc/pbm/runner-defs.nft"   # define MIRROR_POOL4, AGENT_NET4, DASHBOARD4, DASHBOARD_PORTS, ARTIFACT4, ARTIFACT_PORTS
table inet pbm_runner
delete table inet pbm_runner
table inet pbm_runner {
  chain forward { type filter hook forward priority filter - 10; policy accept;
    meta nfproto ipv6 drop
    ip saddr $MIRROR_POOL4 ip daddr $MIRROR_POOL4 accept          # same-bridge service traffic; cross-bridge is dropped by Docker's own isolation chains (delegated, R-W21-4)
    ip saddr $MIRROR_POOL4 drop                                    # mirrors: no egress at all (uplink, agent net, other hosts, VPN)
    ip daddr $MIRROR_POOL4 ct state new drop                       # nobody opens NEW flows into mirrors via forward (a loopback publish goes host->proxy, not forward)
    ip saddr $AGENT_NET4 ip daddr $DASHBOARD4 tcp dport $DASHBOARD_PORTS accept
    ip saddr $AGENT_NET4 ip daddr $ARTIFACT4 tcp dport $ARTIFACT_PORTS accept
    ip saddr $AGENT_NET4 drop
  }
  chain input { type filter hook input priority filter - 10; policy accept;
    ip saddr $MIRROR_POOL4 ct state new drop                       # mirrors cannot open connections to the runner host (sshd, dockerd, ...)
    ip saddr $AGENT_NET4 ct state new drop
  }
  chain output { type filter hook output priority filter - 10; policy accept;
    include "/etc/pbm/runner-dns.nft"                              # dockerd's embedded-DNS forwarding (every container's external DNS) never leaves the VM
  }
}
